services:
  backend:
    build: .
    env_file: .env
    environment:
      # prosljedjujemo sa hosta ako su postavljene; podrazumijevano ugaseno.
      # pokretanje load testa: MOCK_LLM=1 docker compose up -d backend
      - MOCK_LLM=${MOCK_LLM:-0}
      - MOCK_LLM_DELAY=${MOCK_LLM_DELAY:-0.3}
    volumes:
      - upiti_data:/app/data
    healthcheck:
      # backend image je python-slim (nema curl), pa provjeravamo pythonom
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s        # provjeravaj svakih 10s
      timeout: 5s          # jedna provjera sme trajati najvise 5s
      retries: 5           # posle 5 neuspjeha -> "unhealthy"
      start_period: 180s   # cold start (ucitavanje modela) ume da traje dugo na opterecenoj masini

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy    # cekaj da backend bude ZDRAV, ne samo pokrenut

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      # bind mount configa (read-only), pa imenovani volume za podatke
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"          # Prometheus UI, otvaras u browseru na 9090
    depends_on:
      - backend            # koga skuplja? (bez njega nema sta da kupi)

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin    # login: admin / admin
    volumes:
      - grafana_data:/var/lib/grafana       # da dashboardi prezive restart
    ports:
      - "3000:3000"         # Grafana UI
    depends_on:
      - prometheus                # iz cega crta? (datasource)


volumes:
  upiti_data:
  prometheus_data:
  grafana_data:

