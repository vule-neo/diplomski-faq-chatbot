server {
    listen 80;
    listen [::]:80;

    # 1) Reverse proxy: sve sto pocinje sa /api/ ide backendu.
    #    "backend" je ime servisa iz docker-compose.yml, port 8000.
    #    Zavrsni "/" u proxy_pass skida /api prefiks: /api/ask -> /ask
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        # streaming (/ask/stream) - prosljedjuj komad po komad, ne baferuj
        proxy_buffering off;
    }

    # 2) Sve ostalo = staticki Angular sajt
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # SPA: nepostojecu rutu vrati kao index.html da je Angular odradi
        try_files $uri $uri/ /index.html;
    }
}
